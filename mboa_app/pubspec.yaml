name: mboa_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  go_router: ^17.2.3
  image_picker: ^1.2.2
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  video_player: ^2.10.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Logo fourni par le porteur du projet. Trois declinaisons : le logo
    # complet, l'embleme seul pour les petits formats, et la source carree
    # de l'icone de lancement.
    - assets/brand/

  # Inter est embarquee et non telechargee : rendu identique partout, et
  # ouverture rapide sur une connexion faible. Sa couverture de l'alphabet
  # des langues camerounaises (ɓ ɛ ɔ ŋ ǝ) et des diacritiques tonales a ete
  # verifiee glyphe par glyphe.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700


# Icone de lancement, generee depuis le logo fourni :
#   dart run flutter_launcher_icons
# `adaptive_icon_background` reprend le creme du logo : les masques ronds
# d'Android recadrent l'image, et un fond transparent y laisserait du noir.
flutter_launcher_icons:
  image_path: "assets/brand/mboa-icon.png"
  android: true
  # iOS et macOS ne sont pas configures dans ce projet (android, web,
  # windows seulement) : les activer ferait echouer la generation.
  ios: false
  adaptive_icon_background: "#FEFDF9"
  adaptive_icon_foreground: "assets/brand/mboa-icon-foreground.png"
  web:
    generate: true
    background_color: "#FEFDF9"
    theme_color: "#4F46E5"
